<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CCS 生成式 AI 題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左側考綱目錄 + 右側內容（重點整理 → 考題練習）；手機上目錄改為頂端橫向捲動列 */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --ink: #17222A;
  --muted: #5B6870;
  --line: #D7DEDC;
  --accent: #0E6B63;
  --accent-soft: #E1F0EE;
  --mark: #FFE58A;
  --mark-ink: #17222A;
  --good: #1D7A3A;
  --good-soft: #E3F3E7;
  --bad: #B3261E;
  --bad-soft: #FBE6E4;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1416; --surface: #162024; --ink: #E3EAE8; --muted: #97A4A9; --line: #29363A;
    --accent: #52C3B6; --accent-soft: #173431; --mark: #6B5814; --mark-ink: #FFF3C4;
    --good: #6FD08C; --good-soft: #15301E; --bad: #F08C84; --bad-soft: #3A1B19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1416; --surface: #162024; --ink: #E3EAE8; --muted: #97A4A9; --line: #29363A;
  --accent: #52C3B6; --accent-soft: #173431; --mark: #6B5814; --mark-ink: #FFF3C4;
  --good: #6FD08C; --good-soft: #15301E; --bad: #F08C84; --bad-soft: #3A1B19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.75;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 .2em; border-radius: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell {
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px;
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .code { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.brand h1 { font-family: var(--f-display); font-weight: 900; font-size: 26px; line-height: 1.3; margin: 0; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
nav { display: flex; flex-direction: column; gap: 4px; }
nav a {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline;
  text-decoration: none; color: var(--ink); padding: 10px 12px; border-radius: 6px; border: 1px solid transparent;
}
nav a:hover { background: var(--surface); }
nav a[aria-current="page"] { background: var(--surface); border-color: var(--line); }
nav a .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); grid-row: span 2; padding-top: 3px; }
nav a .t { font-weight: 500; font-size: 15px; line-height: 1.45; }
nav a .p { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

main { min-width: 0; display: flex; flex-direction: column; gap: 40px; }
.ch-head { display: flex; flex-direction: column; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
.ch-head .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.ch-head h2 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4vw, 38px); line-height: 1.3; margin: 0; text-wrap: balance; }
.ch-head .en { color: var(--muted); font-size: 15px; }

section > h3 {
  font-family: var(--f-display); font-size: 21px; margin: 0 0 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
section > h3 small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .08em; }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0; }
.note h4 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
.note ul, .note ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.note li { font-size: 15px; }
.note li::marker { color: var(--accent); }
.note .tag { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-right: 4px; white-space: nowrap; }
.tag.ok { background: var(--good-soft); color: var(--good); }
.tag.no { background: var(--bad-soft); color: var(--bad); }

.quiz-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.score { font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; margin-right: auto; }
.score b { color: var(--accent); font-size: 18px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.primary:hover { color: var(--surface); opacity: .9; }

.qs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
.q-top { display: flex; gap: 12px; align-items: baseline; }
.q-no { font-family: var(--f-mono); font-size: 13px; color: var(--accent); flex: none; }
.q-type { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; flex: none; }
.q-text { margin: 0; font-weight: 500; min-width: 0; }
.q-src { font-size: 12px; color: var(--muted); margin: 4px 0 0 0; }
.opts { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.opt {
  width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: baseline;
  background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer; line-height: 1.6;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .k { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { color: var(--bad); }
.exp { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 15px; }
.exp .verdict { font-weight: 700; margin-right: 6px; }
.exp .verdict.ok { color: var(--good); }
.exp .verdict.no { color: var(--bad); }
.exp .verdict.peek { color: var(--accent); }

.result { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; margin-top: 16px; }
.result strong { font-family: var(--f-display); font-size: 28px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 20px 48px; }
  aside { position: static; }
  nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  nav a { flex: none; width: 200px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

{

      <li><b>假定角色（Role）</b>：「你是一位在［目標受眾領域］有著豐富經驗的高級行銷經理」</li>

    { h: "進階提示技術", html: `<ul>

      <li><b>思維鏈（Chain of Thought）</b>：提供<mark>邏輯推導步驟與解答範例</mark>（如紅＋藍 → 紫的色彩推導），引導模型逐步推理。</li>
      <li><b>反向提示詞（Reverse Prompting）</b>：<mark>先讓 AI 詢問必要資訊</mark>，再生成最終內容。範例：「讓我提供簡歷所需的每個關鍵細節，然後使用這些資訊生成簡歷」。</li></ul>` },
    { h: "擴散模型生成圖像（依序）", html: `<ol>

    { q: "自駕車開發中，「僅對停車標誌與交通信號燈進行分詞（標注）」屬於哪一個階段產生的偏見？", o: ["資料收集", "數據標注", "模型訓練", "部署"], a: 1,
      e: "只標注部分物件，其他物件（如行人、路標）沒被標記，屬於數據標注階段的偏見。" },
    { q: "自駕車開發中，「資料包括根據身高採用不同加權值的行人」屬於哪一個階段產生的偏見？", o: ["資料收集", "數據標注", "模型訓練", "部署"], a: 2,
      e: "在訓練時對不同身高的行人給予不同權重，屬於模型訓練階段的偏見。" },
    { q: "自駕車開發中，「汽車銷往各處，但僅在單一城市進行測試」屬於哪一個階段產生的偏見？", o: ["資料收集", "數據標注", "模型訓練", "部署"], a: 3,
      e: "上市使用的範圍遠大於測試範圍，屬於部署階段的偏見。" },
    { q: "下列何者「不是」驗證 AI 輸出正確性的恰當方式？", o: ["在網際網路上搜尋，查證學術資源中的事實", "參考可靠的歷史資料庫或權威機構報告", "使用另一個 AI 平台查證事實", "比對原始文獻與官方統計資料"], a: 2,
      e: "另一個 AI 可能產生相同的幻覺或偏見，不能當作可靠的查證來源。" },
    { q: "企業導入 AI 招募流程時，需要考慮哪些法律？", o: ["個人資料保護法、勞動法、智慧財產權法", "交通法規、建築法", "稅法、關稅法", "海商法、航空法"], a: 0,
      e: "招募涉及應徵者個資（個資法）、聘僱公平（勞動法）與 AI 產出內容的權利歸屬（智財權法）。" },
    { q: "依照最高法院規範，下列哪一種情況可以申請專利？", o: ["完全由 AI 自動產生的發明，並列 AI 為唯一發明者", "使用人工智慧更正現有設計中不準確的地方（包含實質人類貢獻）", "直接將 AI 生成的設計圖原封不動送件", "請 AI 撰寫專利說明書後以 AI 名義申請"], a: 1,
      e: "AI 不能是唯一的發明者，必須有實質的人類貢獻，例如利用 AI 協助更正既有設計的不準確之處。" },
    { q: "為避免個人資訊洩漏，撰寫提示詞時應避免放入下列哪一類資訊？", o: ["一般產業趨勢", "公開的產品名稱", "姓名、年齡、位置與社群媒體帳號等可識別個人資訊（PII）", "文章的字數限制"], a: 2,
      e: "可識別個人資訊（PII）一旦輸入提示詞，就可能被儲存或外洩，應避免使用。" },
    { q: "使用生成式 AI 建立有害或侵權內容時，法律責任由誰承擔？", o: ["AI 模型本身", "AI 開發公司全權負責", "使用者必須對建立的內容負責", "沒有人需要負責"], a: 2,
      e: "使用者須對使用生成式 AI 建立的內容負責，有害或侵權內容可能引發民事或刑事訴訟。" }
  ]
}
];

const KEYS = "ABCD";
const STORE = "ccs-genai-quiz-v1";
let answers = {}, peek = {}, examIds = [];
try { const s = JSON.parse(localStorage.getItem(STORE) || "{}"); answers = s.answers || {}; examIds = s.examIds || []; } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify({ answers, examIds })); } catch (e) {} }

const ALL = [];
CHAPTERS.forEach(ch => ch.qs.forEach((q, i) => { q.id = ch.id + "-" + (i + 1); q.ch = ch; if (q.tf) q.o = ["正確", "錯誤"]; ALL.push(q); }));
const EXAM = { id: "exam", n: "模擬", title: "綜合模擬測驗", en: "從四大考綱隨機抽出 20 題" };

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newExam() { examIds = shuffle(ALL.map(q => q.id)).slice(0, 20); Object.keys(answers).filter(k => k.startsWith("exam:")).forEach(k => delete answers[k]); save(); }
if (!examIds.length || examIds.some(id => !ALL.find(q => q.id === id))) newExam();

function keyOf(scope, q) { return scope === "exam" ? "exam:" + q.id : q.id; }
function questionsOf(scope) { return scope === "exam" ? examIds.map(id => ALL.find(q => q.id === id)) : CHAPTERS.find(c => c.id === scope).qs; }
function stats(scope) {
  const qs = questionsOf(scope); let done = 0, right = 0;
  qs.forEach(q => { const v = answers[keyOf(scope, q)]; if (v !== undefined) { done++; if (v === q.a) right++; } });
  return { total: qs.length, done, right };
}

function renderNav(cur) {
  const nav = document.getElementById("nav");
  nav.innerHTML = [...CHAPTERS, EXAM].map(c => {
    const s = stats(c.id);
    return `<a href="#${c.id}" data-id="${c.id}" ${c.id === cur ? 'aria-current="page"' : ""}>
      <span class="n">${c.n}</span><span class="t">${c.title}</span>
      <span class="p">已答 ${s.done}/${s.total} · 答對 ${s.right}<span class="bar"><i style="width:${s.total ? s.done / s.total * 100 : 0}%"></i></span></span></a>`;
  }).join("");
}

function qHTML(scope, q, idx) {
  const k = keyOf(scope, q), v = answers[k], shown = v !== undefined || peek[k];
  const opts = q.o.map((t, i) => {
    let cls = "";
    if (shown && i === q.a) cls = "correct"; else if (v === i && i !== q.a) cls = "wrong";
    return `<li><button class="opt ${cls}" data-k="${k}" data-i="${i}" ${shown ? "disabled" : ""}><span class="k">${q.tf ? (i ? "✕" : "○") : KEYS[i]}</span><span>${t}</span></button></li>`;
  }).join("");
  let exp = "";
  if (shown) {
    const verdict = v === undefined ? `<span class="verdict peek">答案 ${q.tf ? q.o[q.a] : KEYS[q.a]}</span>`
      : v === q.a ? `<span class="verdict ok">答對了</span>` : `<span class="verdict no">答錯了，正確答案是 ${q.tf ? q.o[q.a] : KEYS[q.a]}</span>`;
    exp = `<div class="exp">${verdict}${q.e}</div>`;
  }
  const src = scope === "exam" ? `<p class="q-src">${q.ch.n}・${q.ch.title}</p>` : "";
  return `<li class="q"><div class="q-top"><span class="q-no">Q${idx + 1}</span><span class="q-type">${q.tf ? "是非" : "單選"}</span><div style="min-width:0"><p class="q-text">${q.q}</p>${src}</div></div><ul class="opts">${opts}</ul>${exp}</li>`;
}

function render(scope) {
  const isExam = scope === "exam";
  const ch = isExam ? EXAM : CHAPTERS.find(c => c.id === scope);
  const qs = questionsOf(scope), s = stats(scope);
  const main = document.getElementById("main");
  const notes = isExam ? "" : `<section><h3>重點整理 <small>KEY POINTS</small></h3><div class="notes">${ch.notes.map(n => `<div class="note"><h4>${n.h}</h4>${n.html}</div>`).join("")}</div></section>`;
  const result = s.done === s.total ? `<div class="result"><strong>${s.right} / ${s.total}</strong><span>${s.right === s.total ? "全部答對，這一章已經熟練。" : `答錯 ${s.total - s.right} 題，建議回頭複習${isExam ? "標示的考綱" : "上方重點整理"}後重新作答。`}</span></div>` : "";
  main.innerHTML = `
    <header class="ch-head"><span class="eyebrow">${isExam ? "Mock Exam" : ch.n}</span><h2>${ch.title}</h2><span class="en">${ch.en}</span></header>
    ${notes}
    <section>
      <h3>${isExam ? "測驗題目" : "考題與解析"} <small>${qs.length} QUESTIONS</small></h3>
      <div class="quiz-tools">
        <span class="score">答對 <b>${s.right}</b> / 已答 ${s.done} / 共 ${s.total} 題</span>
        <button class="btn" id="peekAll">顯示全部解析</button>
        <button class="btn" id="reset">重新作答</button>
        ${isExam ? `<button class="btn primary" id="reroll">重新抽題</button>` : ""}
      </div>
      <ol class="qs">${qs.map((q, i) => qHTML(scope, q, i)).join("")}</ol>
      ${result}
    </section>`;
  renderNav(scope);
}

let current = "ch1";
function go(id, scroll) {
  current = [...CHAPTERS, EXAM].some(c => c.id === id) ? id : "ch1";
  render(current);
  if (scroll) window.scrollTo({ top: 0 });
}

document.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    answers[opt.dataset.k] = +opt.dataset.i; save();
    const y = window.scrollY; render(current); window.scrollTo({ top: y });
    return;
  }
  const a = e.target.closest("nav a");
  if (a) { e.preventDefault(); history.replaceState(null, "", "#" + a.dataset.id); go(a.dataset.id, true); return; }
  const y = window.scrollY;
  if (e.target.id === "peekAll") { questionsOf(current).forEach(q => peek[keyOf(current, q)] = true); render(current); window.scrollTo({ top: y }); }
  if (e.target.id === "reset") { questionsOf(current).forEach(q => { delete answers[keyOf(current, q)]; delete peek[keyOf(current, q)]; }); save(); render(current); }
  if (e.target.id === "reroll") { peek = {}; newExam(); render(current); }
});
window.addEventListener("hashchange", () => go(location.hash.slice(1), true));
go(location.hash.slice(1), false);
</script>
